version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: autohub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub_secret
      POSTGRES_DB: autohub
    ports:
      - "5432:5432"
    volumes:
      - autohub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub -d autohub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  autohub_data:
